name: Build and Release

on:
  push:
    branches: [master, merge-workflow-tests]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Build firmware
    uses: ./.github/workflows/build-firmware.yml

  host:
    name: Build host with fresh firmware
    needs: firmware
    uses: ./.github/workflows/build-host.yml

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, host]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts from this run
        uses: actions/download-artifact@v8
        with:
          path: release
          skip-decompress: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/**
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
