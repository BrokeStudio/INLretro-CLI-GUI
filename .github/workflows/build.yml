name: Build Firmware

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential wget tar

      - name: Install arm-none-eabi-gcc 7.3.1
        run: |
          GCC_VERSION="7-2018q2"
          GCC_DIR="gcc-arm-none-eabi-7-2018-q2-update"
          GCC_TAR="${GCC_DIR}-linux.tar.bz2"
          wget https://developer.arm.com/-/media/Files/downloads/gnu-rm/${GCC_VERSION}/${GCC_TAR}
          tar -xjf ${GCC_TAR}
          echo "$PWD/${GCC_DIR}/bin" >> $GITHUB_PATH
          # export PATH="$PWD/${GCC_DIR}/bin:$PATH" // sous linux

      - name: Verify compiler version
        run: arm-none-eabi-gcc --version

      - name: Build project
        run: |
          cd firmware
          make stm6clean
